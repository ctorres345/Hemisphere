[versions]
# Toolchain. CI and local builds use the same JDK through the Gradle daemon JVM criteria
# (gradle/gradle-daemon-jvm.properties) and the Kotlin toolchain below (ADR 0003: pinned, reproducible).
jdk = "17"
agp = "9.5.1"
kotlin = "2.4.21"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

androidx-activity = "1.13.0"
# 1.19+ needs compileSdk 37.
androidx-core = "1.18.0"
# 2026.08.00+ (Compose 1.12) needs compileSdk 37; we stay on 36 until the targetSdk bump.
compose-bom = "2026.06.01"
# Navigation 3 needs 2.10; 2.10.0 still builds on compileSdk 36 (checkAarMetadata passes).
androidx-lifecycle = "2.10.0"
kotlinx-coroutines = "1.10.2"
hilt = "2.60.1"
ksp = "2.3.14"
# hiltViewModel() for Compose. 1.4.0 needs compileSdk 37 (HEM-22).
androidx-hilt = "1.3.0"
navigation3 = "1.0.1"
kotlinx-serialization = "1.9.0"
# Apache-2.0.
androidx-datastore = "1.1.7"

# Quality
detekt = "1.23.8"
# The Kotlin version detekt 1.23.8 was built with; its own classpath must use exactly this.
detekt-kotlin = "2.0.21"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
compose-lints = "1.6.1"
konsist = "0.18.1"

# Tests
junit = "4.13.2"
# Screenshot tests (HEM-13): Robolectric renders Compose on the JVM, Roborazzi compares the images.
robolectric = "4.17"
roborazzi = "1.78.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

compose-lints = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "compose-lints" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# build-logic only
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Convention plugins (build-logic)
hemisphere-jvm-library = { id = "hemisphere.jvm.library" }
hemisphere-android-library = { id = "hemisphere.android.library" }
hemisphere-android-library-compose = { id = "hemisphere.android.library.compose" }
hemisphere-design-tokens = { id = "hemisphere.design.tokens" }
hemisphere-android-application = { id = "hemisphere.android.application" }
hemisphere-hilt = { id = "hemisphere.hilt" }
hemisphere-screenshot = { id = "hemisphere.screenshot" }
hemisphere-module-graph = { id = "hemisphere.module.graph" }

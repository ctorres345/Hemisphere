<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hemisphere prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<!--
  HEM-3 throwaway prototype. Source of values: docs/design-system.md sections 5 to 7.
  Layout: a control bar on top, the device in the middle, the spec notes beside it.
  One unit here is one dp. Accent colors are provisional placeholders (final hex: HEM-6).
-->
<style>
/* ---------- Page chrome (not part of the app design) ---------- */
:root {
  --pg-bg: #EEEFF1; --pg-panel: #FFFFFF; --pg-line: #DADBDF; --pg-fg: #16171A; --pg-fg2: #5E6168;
  --pg-sel: #16171A; --pg-onsel: #FFFFFF; --pg-bezel: #1B1C1F; --pg-focus: #2F5BD3;
  --pg-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --pg-bg: #0C0D0F; --pg-panel: #16171A; --pg-line: #2A2C30; --pg-fg: #E9E9EB; --pg-fg2: #A3A5AA;
  --pg-sel: #E9E9EB; --pg-onsel: #111214; --pg-bezel: #2A2B2F; --pg-focus: #8AA8F8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --pg-bg: #0C0D0F; --pg-panel: #16171A; --pg-line: #2A2C30; --pg-fg: #E9E9EB; --pg-fg2: #A3A5AA;
  --pg-sel: #E9E9EB; --pg-onsel: #111214; --pg-bezel: #2A2B2F; --pg-focus: #8AA8F8; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--pg-bg); color: var(--pg-fg); font: 14px/1.45 var(--pg-font); }
button { font: inherit; color: inherit; }
.ctl { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
  padding-block: 16px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--pg-panel); border-bottom: 1px solid var(--pg-line); }
.ctl h1 { font-size: 16px; font-weight: 500; margin: 0 8px 0 0; align-self: center; flex-basis: 100%; }
.ctl h1 small { color: var(--pg-fg2); font-weight: 400; font-size: 13px; margin-inline-start: 8px; }
.grp { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grp > span { font-size: 11px; color: var(--pg-fg2); letter-spacing: .02em; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--pg-line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; font-size: 13px; border-inline-end: 1px solid var(--pg-line); }
.seg button:last-child { border-inline-end: 0; }
.seg button[aria-pressed="true"] { background: var(--pg-sel); color: var(--pg-onsel); }
.seg button:focus-visible, .pg-link:focus-visible { outline: 2px solid var(--pg-focus); outline-offset: -2px; }
.wrap { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; justify-content: center;
  padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage { flex: 1 1 520px; min-width: 0; display: flex; justify-content: center; }
.holder { position: relative; }
.notes { flex: 0 1 340px; min-width: 0; background: var(--pg-panel); border: 1px solid var(--pg-line); border-radius: 12px; padding: 16px; font-size: 13px; }
.notes h2 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
.notes h3 { font-size: 13px; font-weight: 500; margin: 16px 0 6px; color: var(--pg-fg2); }
.notes p { margin: 0 0 8px; }
.notes ul { margin: 0; padding-inline-start: 18px; }
.notes li { margin-bottom: 4px; }
.notes code, .keys kbd { font: 12px ui-monospace, "JetBrains Mono", Menlo, monospace; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
.keys kbd { border: 1px solid var(--pg-line); border-radius: 4px; padding: 0 5px; white-space: nowrap; justify-self: start; }
.pad-status { color: var(--pg-fg2); font-size: 12px; margin-top: 8px; }

/* ---------- App tokens: docs/design-system.md section 5 ---------- */
.dev {
  --canvas: #F7F7F8; --raised: #FFFFFF; --overlay: #FFFFFF; --bd: #E3E4E7; --bd-strong: #8A8C91;
  --t1: #16171A; --t2: #5E6168; --t3: #6E7075; --scrim: rgba(22,23,26,.32);
  --danger: #B3261E; --warning: #8A5300; --success: #2E7D4F;
  --ft-folder: #5B6B8C; --ft-image: #2F7D6B; --ft-video: #8A4FA0; --ft-audio: #A0522D; --ft-archive: #8C6A1F;
  --ft-apk: #4F7F2F; --ft-rom: #B03A5B; --ft-doc: #3D6FA3; --ft-code: #5A5F6B; --ft-other: #6E7075;
  /* provisional accent (blue); JS swaps these per picked accent */
  --a-fill: #2F5BD3; --a-on: #FFFFFF; --a-text: #2F5BD3; --a-focus: #2F5BD3;
  --a-tint: color-mix(in srgb, var(--a-fill) 12%, var(--raised));
  /* type: section 6 */
  --f-title: 500 20px/28px var(--app-font); --f-heading: 500 16px/22px var(--app-font); --f-body: 400 14px/20px var(--app-font);
  --f-meta: 400 12px/16px var(--app-font); --f-caption: 400 11px/14px var(--app-font); --app-font: "Inter", Roboto, system-ui, sans-serif;
  /* space and shape: section 7 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --r-chip: 4px; --r-row: 8px; --r-sheet: 12px;
  --row-h: 48px; --icon: 32px;
}
.dev[data-t="dark"] {
  --canvas: #111214; --raised: #18191C; --overlay: #202226; --bd: #26282C; --bd-strong: #6C6E73;
  --t1: #E9E9EB; --t2: #A3A5AA; --t3: #898B90; --scrim: rgba(0,0,0,.56);
  --danger: #F2827A; --warning: #E5A440; --success: #6CC18F;
  --ft-folder: #8D9CC0; --ft-image: #6BBFA9; --ft-video: #C08AD6; --ft-audio: #E0956A; --ft-archive: #D4B060;
  --ft-apk: #93C46E; --ft-rom: #E58AA5; --ft-doc: #85AEDB; --ft-code: #A3A8B3; --ft-other: #898B90;
  --a-tint: color-mix(in srgb, var(--a-fill) 18%, var(--raised));
}
.dev[data-t="amoled"] {
  --canvas: #000000; --raised: #0B0B0C; --overlay: #141416; --bd: #1E1F22; --bd-strong: #626469;
  --t1: #E9E9EB; --t2: #A3A5AA; --t3: #7E8085; --scrim: rgba(0,0,0,.7);
  --danger: #F2827A; --warning: #E5A440; --success: #6CC18F;
  --ft-folder: #8D9CC0; --ft-image: #6BBFA9; --ft-video: #C08AD6; --ft-audio: #E0956A; --ft-archive: #D4B060;
  --ft-apk: #93C46E; --ft-rom: #E58AA5; --ft-doc: #85AEDB; --ft-code: #A3A8B3; --ft-other: #898B90;
  --a-tint: color-mix(in srgb, var(--a-fill) 20%, var(--raised));
}
.dev[data-in="pad"] { --row-h: 40px; --icon: 24px; }

/* ---------- Device frame ---------- */
.dev { position: absolute; top: 0; left: 0; transform-origin: 0 0;
  background: var(--canvas); color: var(--t1); font: var(--f-body); overflow: hidden;
  display: flex; flex-direction: column; box-shadow: 0 0 0 10px var(--pg-bezel); border-radius: 26px; user-select: none; -webkit-user-select: none; }
.dev[data-d="phone"] { width: 412px; height: 915px; }
.dev[data-d="handheld"] { width: 960px; height: 540px; border-radius: 16px; }
.dev svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dev svg .fill { fill: currentColor; stroke: none; }
.dev[dir="rtl"] .flip { transform: scaleX(-1); }
/* Filenames, sizes and other user or English text are bidi-isolated, so they read correctly in an RTL layout */
.dev .meta, .dev .ttl, .dev .crumb, .dev .tx, .dev .chip, .dev .sub, .dev .l2, .dev .job b { unicode-bidi: plaintext; }
.sbar { height: 24px; flex: none; display: flex; align-items: center; justify-content: space-between; padding-inline: var(--s4); font: var(--f-meta); color: var(--t2); font-variant-numeric: tabular-nums; }
.dev[data-d="phone"] .sbar { height: 32px; padding-inline: var(--s5); }
.navbar { height: 20px; flex: none; display: flex; align-items: center; justify-content: center; }
.navbar i { width: 108px; height: 4px; border-radius: 2px; background: var(--t2); opacity: .6; }

/* ---------- Shared pieces ---------- */
.ib { width: 48px; height: 48px; border: 0; background: transparent; color: var(--t2); display: grid; place-items: center; border-radius: var(--r-row); cursor: pointer; flex: none; position: relative; }
.dev[data-in="pad"] .ib { width: 40px; height: 40px; }
.ib:active, .row:active, .btn:active, .chip:active, .rail-i:active, .set-row:active, .menu-i:active, .crumb:active { background: color-mix(in srgb, var(--t1) 10%, transparent); }
.appbar { height: 56px; flex: none; display: flex; align-items: center; gap: var(--s1); padding-inline: var(--s1); }
.appbar .ttl { font: var(--f-title); flex: 1; min-width: 0; padding-inline: var(--s1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev[data-in="pad"] .appbar { height: 48px; }
.crumbs { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-inline: var(--s3); height: 36px; flex: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { border: 0; background: transparent; color: var(--t2); font: var(--f-meta); padding: 6px var(--s2); border-radius: var(--r-chip); white-space: nowrap; cursor: pointer; }
.crumb[aria-current="page"] { color: var(--t1); font-weight: 500; }
.crumbs .sep { color: var(--t3); font: var(--f-meta); }
.list { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; padding-block-end: var(--s2); position: relative; }
.row { display: flex; align-items: center; gap: var(--s3); height: var(--row-h); padding-inline: var(--s4) var(--s3); cursor: pointer; position: relative; border-radius: var(--r-row); margin-inline: var(--s1); }
.row + .row::before { content: ""; position: absolute; inset-block-start: 0; inset-inline: calc(var(--s4) + var(--icon) + var(--s3)) var(--s3); border-top: 1px solid var(--bd); }
.row[aria-selected="true"] { background: var(--a-tint); }
.list.selecting .row + .row::before { inset-inline-start: calc(var(--s4) + 22px + var(--icon) + 2 * var(--s3)); }
.ico { width: var(--icon); height: var(--icon); border-radius: var(--r-chip); display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.dev[data-in="pad"] .ico svg { width: 18px; height: 18px; }
.ico svg { width: 20px; height: 20px; }
.nm { flex: 1; min-width: 0; display: flex; white-space: nowrap; font: var(--f-body); color: var(--t1); }
.nm .a { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 1ch; }
.nm .b { flex: none; }
.meta { font: var(--f-meta); color: var(--t2); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; text-align: end; }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bd-strong); display: grid; place-items: center; flex: none; }
.chk svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }
.row[aria-selected="true"] .chk { background: var(--a-fill); border-color: var(--a-fill); color: var(--a-on); }
.row[aria-selected="true"] .chk svg { opacity: 1; }
.empty { display: grid; place-items: center; text-align: center; gap: var(--s2); padding: var(--s6) var(--s5); color: var(--t2); }
.empty b { font: var(--f-heading); color: var(--t1); }
.btn { height: 40px; border-radius: var(--r-row); border: 1px solid var(--bd-strong); background: transparent; color: var(--t1); font: var(--f-body); font-weight: 500; padding-inline: var(--s4); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); white-space: nowrap; }
.btn.primary { background: var(--a-fill); border-color: var(--a-fill); color: var(--a-on); }
.btn.text { border-color: transparent; color: var(--a-text); padding-inline: var(--s3); }
.btn svg { width: 18px; height: 18px; }
.chip { height: 32px; border-radius: var(--r-chip); border: 1px solid var(--bd); background: transparent; color: var(--t2); font: var(--f-meta); padding-inline: var(--s3); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.chip svg { width: 16px; height: 16px; }
.chip[aria-selected="true"] { background: var(--a-tint); border-color: transparent; color: var(--t1); font-weight: 500; }
.qchip { border-color: transparent; background: var(--a-tint); color: var(--t1); }
.qchip .bar { width: 36px; height: 4px; border-radius: 2px; background: var(--bd); overflow: hidden; }
.qchip .bar i { display: block; height: 100%; background: var(--a-fill); }

/* gamepad focus ring: section 3, always visible in gamepad mode */
.dev[data-in="pad"] .gf { outline: 2px solid var(--a-focus); outline-offset: -2px; border-radius: var(--r-row); }
.dev[data-in="pad"] .row.gf { background: color-mix(in srgb, var(--a-focus) 8%, transparent); }
.dev[data-in="pad"] .row.gf[aria-selected="true"] { background: var(--a-tint); }
.dev[data-in="pad"] .sw.gf { outline-offset: 2px; border-radius: 50%; }
/* filled or selected controls: ring sits outside with a gap, so focus never blends with the fill or the selected state */
.dev[data-in="pad"] .btn.gf, .dev[data-in="pad"] .chip.gf, .dev[data-in="pad"] .fab.gf { outline-offset: 2px; }
.dev[data-in="pad"] .fab.gf { border-radius: var(--r-sheet); }

/* ---------- Single ---------- */
.single { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.fab { position: absolute; inset-inline-end: var(--s4); inset-block-end: var(--s4); width: 56px; height: 56px; border-radius: var(--r-sheet); background: var(--a-fill); color: var(--a-on); border: 0; display: grid; place-items: center; cursor: pointer; }
.selhead { background: var(--a-tint); }
.selhead .ttl { font: var(--f-heading); }
.actbar { flex: none; display: flex; justify-content: space-around; border-top: 1px solid var(--bd); background: var(--raised); padding-block: var(--s1); }
.act { border: 0; background: transparent; color: var(--t1); display: flex; flex-direction: column; align-items: center; gap: 2px; font: var(--f-caption); padding: 6px var(--s2); min-width: 64px; min-height: 48px; border-radius: var(--r-row); cursor: pointer; }
.act.danger { color: var(--danger); }
.tray { flex: none; display: flex; align-items: center; gap: var(--s2); margin: 0 var(--s2) var(--s2); padding-inline: var(--s3) var(--s1); min-height: 56px; background: var(--overlay); border: 1px solid var(--bd); border-radius: var(--r-sheet); }
.tray .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tray .tx b { font: var(--f-body); font-weight: 500; }
.tray .tx span { font: var(--f-meta); color: var(--t2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tray > svg { color: var(--t2); }

/* ---------- Dual ---------- */
.topbar { height: 44px; flex: none; display: flex; align-items: center; gap: var(--s2); padding-inline: var(--s3) var(--s1); border-bottom: 1px solid var(--bd); }
.topbar .ttl { font: var(--f-heading); flex: 1; }
.dual { flex: 1; display: flex; min-height: 0; }
.rail { width: 56px; flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--s1); padding-block: var(--s2); border-inline-end: 1px solid var(--bd); }
.rail .grow { flex: 1; }
.rail-i { width: 48px; height: 48px; border: 0; border-radius: var(--r-row); background: transparent; color: var(--t2); display: grid; place-items: center; cursor: pointer; }
.rail-i[aria-current="true"] { background: var(--a-tint); color: var(--t1); }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.pane + .pane { border-inline-start: 1px solid var(--bd); }
.phead { flex: none; position: relative; padding-block-start: 3px; }
.pane.active .phead::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 0; height: 3px; background: var(--a-fill); }
.dev[data-in="touch"] .tabs { height: 48px; }
.dev[data-in="touch"] .crumbs { height: 48px; }
.tabs { display: flex; gap: var(--s1); align-items: center; padding: var(--s1) var(--s2) 0; overflow-x: auto; scrollbar-width: none; height: 40px; }
.tabs .chip { height: 30px; }
.pane:not(.active) .nm, .pane:not(.active) .crumb[aria-current="page"], .pane:not(.active) .chip[aria-selected="true"] { color: var(--t2); }
.pane:not(.active) .chip:not([aria-selected="true"]) { color: var(--t3); }
.pane:not(.active) .chip[aria-selected="true"] { background: transparent; border-color: var(--bd); font-weight: 400; }
.pane:not(.active) .meta, .pane:not(.active) .crumb { color: var(--t3); }
.psel { display: flex; align-items: center; gap: var(--s1); height: 40px; padding-inline: var(--s1) var(--s2); background: var(--a-tint); }
.psel .ttl { font: var(--f-body); font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.psel .btn { height: 32px; padding-inline: var(--s2); font: var(--f-meta); font-weight: 500; border-color: transparent; }
.psel .btn.danger { color: var(--danger); }

/* ---------- Gamepad hint footer ---------- */
.keypair { display: inline-flex; gap: inherit; }
.hints { position: relative; z-index: 7; flex: none; height: 32px; display: flex; align-items: center; gap: var(--s4); padding-inline: var(--s4); border-top: 1px solid var(--bd); background: var(--raised); font: var(--f-meta); color: var(--t2); white-space: nowrap; overflow: hidden; }
.dev[data-d="phone"] .hints { gap: var(--s3); padding-inline: var(--s3); }
.hint { display: inline-flex; align-items: center; gap: 5px; }
.gl { min-width: 18px; height: 18px; border-radius: 9px; border: 1.5px solid var(--t2); color: var(--t1); display: inline-grid; place-items: center; font: 500 10px/1 var(--app-font); padding-inline: 3px; }
.gl.sq { border-radius: var(--r-chip); }
.hints .end { margin-inline-start: auto; }

/* ---------- Overlays ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
.sheet { position: absolute; inset-inline: 0; inset-block-end: 0; z-index: 6; background: var(--overlay); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: var(--s2) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); max-height: 85%; overflow-y: auto; }
.dev[data-d="phone"][data-in="pad"] .sheet { padding-block-end: calc(var(--s4) + 52px); }
.dev[data-d="handheld"] .sheet { inset-inline: 0; margin-inline: auto; inset-block: 50% auto; transform: translateY(-50%); width: 520px; border-radius: var(--r-sheet); padding-block-start: var(--s4); }
.grab { width: 32px; height: 4px; border-radius: 2px; background: var(--bd-strong); align-self: center; }
.dev[data-d="handheld"] .grab { display: none; }
.sheet h3 { font: var(--f-title); margin: 0; }
.sheet .sub { font: var(--f-meta); color: var(--t2); margin: 0; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.cmp > div { border: 1px solid var(--bd); border-radius: var(--r-row); padding: var(--s3); display: flex; flex-direction: column; gap: 2px; background: var(--raised); }
.cmp .k { font: var(--f-caption); color: var(--t2); }
.cmp .v { font: var(--f-body); font-variant-numeric: tabular-nums; }
.cmp .tag { font: var(--f-caption); color: var(--t1); display: inline-flex; align-items: center; gap: 4px; }
.cmp .tag svg { width: 14px; height: 14px; }
.ckrow { display: flex; align-items: center; gap: var(--s3); min-height: 48px; border-radius: var(--r-row); padding-inline: var(--s1); cursor: pointer; }
.box { width: 20px; height: 20px; border-radius: var(--r-chip); border: 2px solid var(--bd-strong); display: grid; place-items: center; flex: none; }
.box svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }
.ckrow[aria-checked="true"] .box { background: var(--a-fill); border-color: var(--a-fill); color: var(--a-on); }
.ckrow[aria-checked="true"] .box svg { opacity: 1; }
.btns { display: flex; gap: var(--s2); justify-content: flex-end; flex-wrap: wrap; }
.job { display: flex; flex-direction: column; gap: 6px; padding-block: var(--s2); border-top: 1px solid var(--bd); }
.job:first-of-type { border-top: 0; }
.job .l1 { display: flex; align-items: center; gap: var(--s2); }
.job .l1 b { font: var(--f-body); font-weight: 500; flex: 1; min-width: 0; }
.job .l2 { font: var(--f-meta); color: var(--t2); font-variant-numeric: tabular-nums; }
.prog { height: 6px; border-radius: 3px; background: var(--bd); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--a-fill); transition: width .4s linear; }
.state-ok { color: var(--success); display: inline-flex; gap: 4px; align-items: center; font: var(--f-meta); }
.state-ok svg { width: 16px; height: 16px; }

  switch (a) {
    case 'row': if (S.layout === 'dual') S.active = pi; S.focus = el.dataset.f; openEntry(pi, el.dataset.n); break;
    case 'crumb': tabOf(pi).path = el.dataset.p; tabOf(pi).sel = []; S.focus = null; if (S.layout === 'dual') S.active = pi; break;
    case 'tab': S.panes[pi].tab = +el.dataset.i; S.active = pi; S.focus = el.dataset.f; break;
    case 'tabadd': if (S.panes[pi].tabs.length >= 8) { toast('A pane holds up to 8 tabs'); break; } S.panes[pi].tabs.push({ path: rootOf(tabOf(pi).path), sel: [] }); S.panes[pi].tab = S.panes[pi].tabs.length - 1; S.active = pi; break;
    case 'place': S.overlay = null; closeSettings(); tabOf(curPane()).path = el.dataset.p; tabOf(curPane()).sel = []; S.focus = null; break;
    case 'drawer': S.overlay = 'drawer'; S.focus = 'd-int'; break;
    case 'layout': S.layout = S.layout === 'dual' ? 'single' : 'dual'; S.active = 0; S.focus = null; S.overlay = null; break;
    case 'search': toast('Search is scoped to this folder (not in this prototype)'); break;
    case 'start': S.menuPos = menuAt(el, -180, 300); S.overlay = 'start'; S.focus = 'm-0'; break;
    case 'selclear': tabOf(curPane()).sel = []; break;
    case 'selall': S.overlay = null; tabOf(curPane()).sel = ls(tabOf(curPane()).path).map(e => e.n); break;
    case 'copy': case 'cut': { const t = tabOf(0); S.clip = { names: [...t.sel], from: t.path, mb: sizeOf(t.path, t.sel), mode: a }; t.sel = []; S.focus = 'drawer'; toast(`${plural(S.clip.names.length, 'item')} on the clipboard. Go to a folder and paste.`); break; }
    case 'copy1': case 'cut1': { S.overlay = null; const t = tabOf(curPane()), n = S.menuFor;
      if (S.layout === 'dual') startConflict([n], t.path, tabOf(1 - S.active).path, a === 'cut1' ? 'move' : 'copy');
      else { S.clip = { names: [n], from: t.path, mb: sizeOf(t.path, [n]), mode: a === 'cut1' ? 'cut' : 'copy' }; } break; }
    case 'open': S.overlay = null; openEntry(curPane(), S.menuFor); break;
    case 'paste': { const c = S.clip, to = tabOf(0).path; if (to === c.from) { toast('Pick another folder to paste into'); break; } startConflict(c.names, c.from, to, c.mode === 'cut' ? 'move' : 'copy'); break; }
    case 'trayclose': S.clip = null; S.focus = null; break;
    case 'copyother': case 'moveother': { const t = tabOf(S.active), names = [...t.sel]; t.sel = []; startConflict(names, t.path, tabOf(1 - S.active).path, a === 'moveother' ? 'move' : 'copy'); break; }
    case 'delete': case 'delete1': { const t = tabOf(curPane()); const n = a === 'delete1' ? 1 : t.sel.length; t.sel = []; S.overlay = null; toast(`Moved ${n} item${n > 1 ? 's' : ''} to Trash`, true); break; }
    case 'undo': S.snack = null; toast('Restored from Trash'); break;
    case 'applyall': S.applyAll = !S.applyAll; break;
    case 'cf': { const c = S.conflict, left = c.list.length - c.i - 1;
      c.skipped = c.skipped || [];
      if (el.dataset.v === 'skip') c.skipped.push(...(left && S.applyAll ? c.list.slice(c.i) : [c.list[c.i]]));
      if (left && !S.applyAll) { c.i++; S.focus = 'cf-keep'; break; }
      const names = c.all.filter(n => !c.skipped.includes(n));
      if (names.length) addJob(names, c.from, c.to, c.mode); else { S.overlay = null; S.clip = null; toast('Nothing was copied'); }
      S.conflict = null; S.focus = null; break; }
    case 'queue': S.overlay = 'queue'; S.focus = null; break;
    case 'qpause': { const j = S.jobs.find(x => x.id == el.dataset.i); if (!j || j.st === 'done') break;
      j.st = j.st === 'pause' ? (S.jobs.some(x => x.st === 'run') ? 'wait' : 'run') : 'pause'; nextJob(); break; }
    case 'qcancel': S.jobs = S.jobs.filter(x => x.id != el.dataset.i); S.focus = null; nextJob(); break;
    case 'close': S.overlay = null; S.focus = null; break;
    case 'settings': S.overlay = null; S.settings = true; S.screen = 'settings'; S.focus = null; break;
    case 'setback': closeSettings(); S.focus = null; break;
    case 'settheme': S.themeChoice = el.dataset.v; S.theme = el.dataset.v === 'system' ? systemTheme() : el.dataset.v; S.focus = el.dataset.f; break;
    case 'accent': S.accent = el.dataset.v; S.focus = el.dataset.f; break;
    case 'you': S.you = !S.you; break;
    case 'toast': S.overlay = null; toast(el.dataset.msg || `${el.getAttribute('aria-label')} (not in this prototype)`); break;
  }
  render();
}

/* ---------------- Input: touch / mouse ---------------- */
let lp = null, lpFired = false;
let pointerDown = false;
addEventListener('pointerup', () => { pointerDown = false; }); addEventListener('pointercancel', () => { pointerDown = false; });
dev.addEventListener('pointerdown', e => {
  pointerDown = true;
  // Switch to touch, but leave the layout alone until the click lands: pad mode has other sizes, so a
  // relayout here would move the button out from under the finger.
  S.input = 'touch';
  const row = e.target.closest('.row'); lpFired = false;
  if (row) lp = setTimeout(() => { lpFired = true; const pi = +row.dataset.pane; if (S.layout === 'dual') S.active = pi; toggleSel(pi, row.dataset.n); render(); }, 450);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => dev.addEventListener(t, () => clearTimeout(lp)));
dev.addEventListener('contextmenu', e => { if (e.target.closest('.row')) e.preventDefault(); });
dev.addEventListener('click', e => {
  if (lpFired) { lpFired = false; return; }
  const el = e.target.closest('[data-act]'); if (!el) { render(); return; }
  if (el.dataset.f) S.focus = el.dataset.f;
  act(el);
});

/* ---------------- Input: gamepad (keyboard or a real pad) ---------------- */
function button(b) {
  if (S.input !== 'pad') { S.input = 'pad'; render(); if (b !== 'up' && b !== 'down' && b !== 'left' && b !== 'right') return; }
  const cur = focusables().find(el => el.dataset.f === S.focus);
  const pi = cur && cur.dataset.pane != null ? +cur.dataset.pane : curPane();
  switch (b) {
    case 'up': case 'down': case 'left': case 'right': move(b); return;
    case 'A': if (cur) { cur.click(); } return;
    case 'B':
      if (S.overlay) { S.overlay = null; S.focus = null; }
      else if (tabOf(pi).sel.length) tabOf(pi).sel = [];
      else if (S.settings) { closeSettings(); S.focus = null; }
      else if (!goUp(pi)) return;
      break;
    case 'X': if (cur && cur.classList.contains('row')) { S.menuFor = cur.dataset.n; S.menuPos = menuAt(cur, 40, 330); S.overlay = 'menu'; S.focus = 'm-0'; } else return; break;
    case 'Y': if (cur && cur.classList.contains('row')) toggleSel(+cur.dataset.pane, cur.dataset.n); else return; break;
    case 'L1': case 'R1': {
      if (S.layout !== 'dual' || S.overlay || S.settings) return;
      // L1 always goes to the pane on the physical left, R1 to the right (mirrored in RTL).
      const leftPane = S.dir === 'rtl' ? 1 : 0; S.active = b === 'L1' ? leftPane : 1 - leftPane; S.focus = null; break; }
    case 'L2': case 'R2': { const P0 = S.panes[pi], n = P0.tabs.length; P0.tab = (P0.tab + (b === 'R2' ? 1 : n - 1)) % n; S.focus = null; break; }
    case 'Select': S.layout = S.layout === 'dual' ? 'single' : 'dual'; S.active = 0; S.focus = null; S.overlay = null; break;
    case 'Start': { const m = dev.querySelector('[data-f="more"]'); if (m && !S.overlay) act(m); return; }
  }
  render();
}
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'A', Escape: 'B', Backspace: 'B', x: 'X', y: 'Y', q: 'L1', e: 'R1', z: 'L2', c: 'R2', s: 'Select', p: 'Start' };
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inCtl = e.target.closest && e.target.closest('.ctl');
  const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!k) return;
  if (inCtl) return; // keyboard use of the control bar stays normal
  e.preventDefault(); button(k);
});
const PADMAP = { 0: 'A', 1: 'B', 2: 'X', 3: 'Y', 4: 'L1', 5: 'R1', 6: 'L2', 7: 'R2', 8: 'Select', 9: 'Start', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
let prev = {}, padName = '';
function poll() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  for (const g of pads) {
    padName = g.id;
    g.buttons.forEach((bt, i) => { const was = prev[g.index + ':' + i]; if (bt.pressed && !was && PADMAP[i]) button(PADMAP[i]); prev[g.index + ':' + i] = bt.pressed; });
    const ax = g.axes, st = [ax[1] < -.6 && 'up', ax[1] > .6 && 'down', ax[0] < -.6 && 'left', ax[0] > .6 && 'right'];
    st.forEach((s, i) => { const key = g.index + ':ax' + i; if (s && !prev[key]) button(s); prev[key] = !!s; });
  }
  if (pads.length) requestAnimationFrame(poll); else polling = false;
}
let polling = false;
addEventListener('gamepadconnected', () => { notes(); if (!polling) { polling = true; requestAnimationFrame(poll); } });
addEventListener('gamepaddisconnected', () => notes());

/* ---------------- Queue progress tick ---------------- */
// One job runs at a time: when none is running, the first waiting job starts.
function closeSettings() { if (S.settings) { S.settings = false; S.screen = S.layout === 'dual' ? 'dual' : 'single'; } }
function nextJob() { if (!S.jobs.some(j => j.st === 'run')) { const nx = S.jobs.find(j => j.st === 'wait'); if (nx) nx.st = 'run'; } }
setInterval(() => {
  const run = S.jobs.find(j => j.st === 'run'); if (!run) return;
  run.done = Math.min(1, run.done + 18 / run.mb * 0.8);
  if (run.done >= 1) { run.st = 'done'; run.kind = run.kind === 'Moving' ? 'Moved' : 'Copied'; nextJob(); }
  if (!pointerDown) render(); // a rebuild mid-tap would drop the tap
}, 800);

/* ---------------- Controls, fit, notes ---------------- */
document.querySelectorAll('.seg').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = g.dataset.k, v = b.dataset.v;
  if (e.detail > 0) b.blur(); // after a mouse click, keys drive the mockup again
  if (k === 'screen') { S.screen = v; S.jobs = v === 'queue' ? S.jobs : []; S.conflict = null; S.snack = null; SCREENS[v](); }
  else if (k === 'device') { S.device = v; S.layout = v === 'handheld' ? 'dual' : 'single'; S.active = 0; S.focus = null;
    if (S.screen === 'single' || S.screen === 'dual') S.screen = S.layout;
    if (['drawer', 'menu', 'start'].includes(S.overlay)) S.overlay = null; }
  else if (k === 'theme') { S.theme = v; S.themeChoice = v; }
  else if (k === 'dir') { S.dir = v; }
  else S[k] = v;
  render();
}));
function syncControls() {
  document.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[g.dataset.k] === b.dataset.v))));
}
function fit() {
  const st = document.getElementById('stage'), h = document.getElementById('holder');
  const w = dev.offsetWidth, ht = dev.offsetHeight, pad = 20;
  const avail = Math.max(240, st.clientWidth - pad * 2), maxH = Math.max(420, innerHeight - 40);
  const k = Math.min(1, avail / w, S.device === 'phone' ? maxH / ht : 1);
  dev.style.transform = `translate(10px, 10px) scale(${k})`;
  h.style.width = (w * k + pad) + 'px'; h.style.height = (ht * k + pad) + 'px';
}
let fitQueued = false;
addEventListener('resize', () => { if (!fitQueued) { fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); } });

const NOTES = {
  single: ['Phone · Single', 'One pane below 600dp wide. Title, path, rows, one primary action (the + button).', [
    'Row: 48dp touch, 40dp gamepad. Icon 32dp / 24dp, radius 4.', 'Name: body 14/400, cut in the middle so the region and extension stay visible.', 'Meta: meta 12/400, tabular numbers, text.secondary.', 'Dividers: border.default, inset to the name.', 'FAB: 56dp, accent.fill, radius 12. Hidden while selecting or while the clipboard tray shows.']],
  dual: ['Handheld · Dual', 'Two panes from 600dp. Each pane has its own tabs, path and back stack.', [
    'Rail: 56dp, places on top, Settings at the bottom. Reach it with D-pad left.', 'Active pane: 3dp accent bar on top of the pane header.', 'Inactive pane: text steps down one token (primary → secondary, secondary → tertiary), no opacity.', 'Tabs: 30dp chips, selected uses accent.tint. L2/R2 switch tabs.', 'L1 goes to the left pane, R1 to the right pane, in LTR and RTL.']],
  select: ['Selection + clipboard', 'Long-press a row, or press Y on a gamepad. Selected rows get a check mark and accent.tint.', [
    'Header: "3 selected · 1.2 GB", heading 16/500 on accent.tint.', 'Phone: action bar at the bottom (Copy, Cut, Rename, Share, Delete). Delete uses danger with an icon and label.', 'Copy or Cut puts the items on the clipboard tray, which stays while you move between folders and places.', 'Dual: actions sit in the active pane header. Copy → and Move → go straight to the other pane, no clipboard.', 'Try: tap Copy, open the menu, choose SD card, then Paste here.']],
  conflict: ['Conflict sheet', 'One sheet per conflict, with the two files side by side.', [
    'Sheet: surface.overlay, radius 12 on top (phone) or a centered 520dp dialog (handheld).', 'Compare cards: surface.raised with border.default. "Newer" and "Larger" are words with an icon, not only color.', 'Keep both is the primary (accent.fill) because it never loses data. Replace and Skip are outlined.', 'Checkbox "Do the same for the other N" uses border.strong when off.']],
  queue: ['Queue sheet', 'Copy and move run in the background. The chip in the top bar shows count and percent; tap it for the list.', [
    'Progress: 6dp bar, accent.fill on border.default.', 'Finished jobs show a check icon and the word "Finished" in success.', 'Pause and Cancel are 48dp icon buttons with labels for TalkBack.', 'The system notification mirrors this list (not drawn here).']],
  settings: ['Settings', 'Theme and accent pickers, layout pins and gamepad options.', [
    'Theme: four chips (System, Light, Dark, AMOLED). The prototype theme follows your pick.', 'Accent: 8 swatches, 36dp circles in 48dp targets, selected one has a check and a 2dp ring. Values are placeholders until HEM-6.', 'Switch: border.strong track when off (meets 3:1), accent.fill when on.', 'Layout pins are saved per device and per orientation.']]
};
function notes() {
  const n = NOTES[S.screen] || NOTES.single;
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  document.getElementById('notes').innerHTML = `<h2>${n[0]}</h2><p>${n[1]}</p><h3>Values</h3><ul>${n[2].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>Gamepad on a keyboard</h3><div class="keys"><kbd>Arrows</kbd><span>D-pad</span><kbd>Enter</kbd><span>Ⓐ Open</span><kbd>Esc</kbd><span>Ⓑ Back</span><kbd>X</kbd><span>Ⓧ Menu</span><kbd>Y</kbd><span>Ⓨ Mark</span><kbd>Q / E</kbd><span>L1 / R1 Pane</span><kbd>Z / C</kbd><span>L2 / R2 Tab</span><kbd>S</kbd><span>Select: Single ↔ Dual</span><kbd>P</kbd><span>Start: Actions</span></div>
    <p class="pad-status">${pads.length ? 'Controller connected. Its buttons work too.' : 'A real controller works too: plug it in and press a button.'} Any key switches to gamepad mode; a tap or click switches back to touch.</p>`;
}

SCREENS.single();
render();
if (document.fonts) document.fonts.ready.then(fit);
</script>
</body>

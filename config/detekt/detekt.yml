# Detekt rules for every module, on top of detekt's defaults (buildUponDefaultConfig).
# The rules named in docs/code-guidelines.md. A module can lift a rule in config/detekt/<module>.yml.

coroutines:
  # Dispatchers are injected (@IoDispatcher), never Dispatchers.IO in app code (architecture §9).
  InjectDispatcher:
    active: true
    dispatcherNames: ['IO', 'Default', 'Unconfined']
  # Never swallow CancellationException (architecture §3).
  SuspendFunSwallowedCancellation:
    active: true

style:
  ForbiddenImport:
    active: true
    imports:
      - value: 'java.io.File'
        reason: 'Use FsPath. Only core:fs touches files (ADR 0006).'
      - value: 'java.nio.file.Path'
        reason: 'Use FsPath. Only core:fs touches files (ADR 0006).'
      - value: 'java.nio.file.Paths'
        reason: 'Use FsPath. Only core:fs touches files (ADR 0006).'
      - value: 'androidx.compose.ui.graphics.Color'
        reason: 'UI code reads HemisphereTheme.colors, never raw colors such as Color.Black (design-system §5).'
      - value: 'androidx.compose.ui.unit.dp'
        reason: 'UI code uses design tokens (HemisphereSpacing, HemisphereRowHeight, HemisphereSizes), never raw sizes (design-system §7).'
      - value: 'androidx.compose.ui.unit.sp'
        reason: 'UI code uses HemisphereTheme.typography, never raw font sizes (design-system §6).'
      - value: 'androidx.compose.ui.unit.em'
        reason: 'UI code uses type tokens, never raw sizes (design-system §6).'
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'androidx.compose.ui.graphics.Color'
        reason: 'UI code uses design tokens, never raw colors (design-system §5).'
      - value: 'androidx.compose.ui.unit.Dp.<init>'
        reason: 'UI code uses size tokens from core:designsystem, never raw sizes (design-system §11).'
      - value: 'androidx.compose.ui.unit.TextUnit'
        reason: 'UI code uses type tokens, never raw sizes (design-system §6).'
      - value: 'androidx.compose.foundation.shape.RoundedCornerShape(kotlin.Int)'
        reason: 'UI code uses HemisphereShapes, never raw radii (design-system §7).'
      - value: 'androidx.compose.foundation.shape.RoundedCornerShape(kotlin.Float)'
        reason: 'UI code uses HemisphereShapes, never raw radii (design-system §7).'
      - value: 'androidx.compose.ui.res.colorResource'
        reason: 'Colors come from the tokens through HemisphereTheme.colors, not Android resources (design-system §11).'
      - value: 'androidx.compose.ui.res.dimensionResource'
        reason: 'Sizes come from the tokens through core:designsystem, not Android resources (design-system §11).'
      - value: 'java.io.File.createTempFile'
        reason: 'Use ScratchSpace for seekable scratch writes (architecture §3).'
      - value: 'kotlin.io.createTempFile'
        reason: 'Use ScratchSpace for seekable scratch writes (architecture §3).'
      - value: 'kotlin.io.path.createTempFile'
        reason: 'Use ScratchSpace for seekable scratch writes (architecture §3).'
      - value: 'java.nio.file.Files.createTempFile'
        reason: 'Use ScratchSpace for seekable scratch writes (architecture §3).'
  # Compose previews are private and only the IDE calls them.
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

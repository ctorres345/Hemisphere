name: android

# Builds the debug APK and runs `./gradlew check` (unit tests, Konsist, Android Lint, ktlint, detekt,
# the module-graph check) on every PR. No path filters: both jobs are required checks, and a job that
# skips on a docs-only PR would never report, so that PR could never merge.
on:
  pull_request:
  # Pushes to the long-lived branches write the Gradle cache that PR runs read.
  push:
    branches: [main, mvp]
  workflow_dispatch:
    inputs:
      record-screenshots:
        description: Re-record the screenshot goldens on Linux and upload them as the screenshot-goldens artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: gradle-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same JDK as gradle/gradle-daemon-jvm.properties and the Kotlin toolchain (ADR 0003).
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # Validates the wrapper checksum and caches Gradle and the build cache. Pushes to main and mvp write
      # the cache; PR runs only read it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build the debug APK
        run: ./gradlew assembleDebug --console=plain

  check:
    name: gradle-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The same command as [check] in .nousfx/project.toml, which the review gate runs.
      - name: Run tests and lint
        run: ./gradlew check --console=plain

      # The Room plugin rewrites schemas/<db>/<version>.json from the entities on every build. A
      # committed version must never change (a new schema needs a new version and a migration), and
      # a new version's file must be committed with it.
      - name: Check Room schemas are committed and unchanged
        run: |
          changed="$(git status --porcelain --untracked-files=all -- '*/schemas/')"
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi

      # On a screenshot mismatch, the expected, actual and diff images help decide: fix or re-record.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi/'
          if-no-files-found: ignore
          retention-days: 7

  # Manual runs only: the screenshot goldens are Linux renders, so they are recorded here
  # (BrowserScreenshotTest). Its own job name keeps the required gradle-check from turning green.
  record-goldens:
    name: record-goldens
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record-screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # No build cache: Roborazzi writes the goldens as a side effect, which a cache hit would skip.
      - name: Record screenshot goldens
        run: ./gradlew recordRoborazziDebug --no-build-cache --console=plain

      # Staged with their repo paths, so the artifact unzips at the repo root however many modules have goldens.
      - name: Stage screenshot goldens
        run: |
          mkdir -p "$RUNNER_TEMP/goldens"
          git ls-files --others --modified --cached -- '*/src/test/screenshots/*.png' \
            | xargs -r cp --parents -t "$RUNNER_TEMP/goldens"

      - name: Upload screenshot goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-goldens
          path: ${{ runner.temp }}/goldens/
          if-no-files-found: error
          retention-days: 7
